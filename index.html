<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inciampi Geniali — La serendipità nella storia</title>
  <meta name="description" content="Le grandi scoperte serendipiche raccontate su un planisfero disegnato a mano." />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header">
    <h1 class="site-title">Inciampi Geniali</h1>
    <nav class="site-nav">
      <a href="#intro">Serendipità</a>
      <a href="#mappa">Planisfero</a>
    </nav>
  </header>

  <main>
    <!-- Sezione 1: introduzione + favola di Serendippo -->
    <section id="intro" class="section section--intro">
      <div class="section__inner">
        <h2>Cos'è la serendipità</h2>
        <div id="intro-text" class="prose">
          <!-- Testo introduttivo: sarà popolato dal contenuto del Google Doc, scheda "Scaletta" -->
          <p class="placeholder">[Testo introduttivo da inserire]</p>
        </div>

        <h2>La favola dei tre principi di Serendippo</h2>
        <div id="favola-text" class="prose">
          <!-- Riassunto della favola -->
          <p class="placeholder">[Riassunto della favola da inserire]</p>
        </div>
      </div>
    </section>

    <!-- Sezione 2: planisfero con pin animati -->
    <section id="mappa" class="section section--map">
      <div class="section__inner">
        <h2>Il planisfero delle scoperte</h2>
        <p class="map-hint">Clicca un pin per scoprire la storia.</p>

        <div id="map-container" class="map-container" aria-label="Planisfero delle scoperte serendipiche">
          <!-- L'SVG del planisfero verrà iniettato qui da js/app.js -->
        </div>
      </div>
    </section>
  </main>

  <!-- Modal per il dettaglio della scoperta -->
  <div id="discovery-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" hidden>
    <div class="modal__backdrop" data-close-modal></div>
    <div class="modal__panel">
      <button class="modal__close" type="button" aria-label="Chiudi" data-close-modal>&times;</button>
      <img id="modal-photo" class="modal__photo" alt="" />
      <h3 id="modal-title" class="modal__title"></h3>
      <p id="modal-meta" class="modal__meta"></p>
      <p id="modal-summary" class="modal__summary"></p>
    </div>
  </div>

  <footer class="site-footer">
    <small>Inciampi Geniali &middot; progetto sulla serendipità</small>
  </footer>

  <script src="js/app.js" type="module"></script>
</body>
</html>
