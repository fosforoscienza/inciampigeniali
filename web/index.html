<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inciampi Geniali</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Lora:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Inter:wght@400;500;700&display=swap" />
  <link rel="stylesheet" href="css/style.css?v=22" />
</head>
<body>

  <!-- ============================================================ -->
  <!-- PRESENTAZIONE                                                 -->
  <!-- ============================================================ -->
  <section id="screen-presentation" class="screen screen--presentation" data-screen="presentation">
    <div id="deck" class="deck" aria-live="polite"></div>
    <div id="deck-chrome" class="deck__chrome" hidden>
      <span class="deck__progress"><span id="slide-current">1</span>&thinsp;/&thinsp;<span id="slide-total">1</span></span>
      <span class="deck__hint">← / →&nbsp; per navigare &nbsp;·&nbsp; <kbd>F</kbd>&nbsp;fullscreen &nbsp;·&nbsp; <kbd>M</kbd>&nbsp;mappa</span>
    </div>
    <button id="deck-chrome-toggle" class="deck__chrome-toggle" type="button">Comandi</button>
  </section>

  <!-- ============================================================ -->
  <!-- PLANISFERO                                                    -->
  <!-- ============================================================ -->
  <section id="screen-map" class="screen screen--map" data-screen="map" hidden>
    <div id="map-container" class="map-container">
      <div id="map-stage" class="map-stage">
        <img id="map-image" class="map-image" src="assets/map/planisfero.png" alt="Planisfero disegnato a mano" />
        <div id="pins" class="pins"></div>
        <div id="coord-readout" class="coord-readout" hidden>0.0%, 0.0%</div>
      </div>
    </div>
    <img class="map-logo" src="assets/decor/logo-fosforo.png" alt="Fosforo Scienza" />
    <button id="map-btn-fine" class="map-btn-fine" type="button">Fine</button>
    <div id="calibrate-panel" class="calibrate-panel" hidden>
      <span class="calibrate-panel__label">Modalità calibrazione attiva &middot; trascina i pin, poi:</span>
      <button id="copy-coords" class="chrome-btn" type="button">Copia coordinate</button>
      <button id="exit-calibrate" class="chrome-btn" type="button">Esci (C)</button>
    </div>
  </section>

  <!-- Overlay nero globale, attivato col tasto B -->
  <div id="black-overlay" class="black-overlay" hidden></div>

  <!-- ============================================================ -->
  <!-- MODAL scoperta — disegno + titolo + sottotitolo               -->
  <!-- ============================================================ -->
  <div id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" hidden>
    <div class="modal__backdrop" data-close-modal></div>
    <div class="modal__panel" role="document">
      <button class="modal__close" type="button" aria-label="Chiudi" data-close-modal>&times;</button>
      <header class="modal__header">
        <h2 id="modal-title" class="modal__title"></h2>
        <p id="modal-subtitle" class="modal__subtitle"></p>
      </header>
      <img id="modal-drawing" class="modal__drawing" src="" alt="" />
      <button id="modal-story-btn" class="modal__story-btn" type="button" hidden>Leggi la storia completa</button>
      <div id="modal-story" class="modal__story" hidden>
        <p id="modal-summary" class="modal__summary"></p>
      </div>
    </div>
  </div>

  <script src="js/slides.js?v=22"></script>
  <script src="js/map.js?v=22"></script>
  <script src="js/app.js?v=22"></script>
</body>
</html>
